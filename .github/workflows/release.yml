name: Release NODUS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches versionName
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test "$TAG_VERSION" = "$CURRENT_VERSION" || {
            echo "Tag $TAG_VERSION does not match versionName $CURRENT_VERSION"
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore/keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Fetch mihomo core
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail \
            -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz
          gzip -dc /tmp/mihomo.gz > app/src/main/assets/mihomo
          chmod +x app/src/main/assets/mihomo
          test "$(stat -c%s app/src/main/assets/mihomo)" -gt 10000000

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Prepare release asset
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test "$(stat -c%s "$APK")" -gt 40000000
          unzip -l "$APK" | grep -q 'assets/mihomo'
          cp "$APK" NODUS.apk
          sha256sum NODUS.apk > NODUS.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NODUS.apk
            NODUS.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true